# Render expands PORT and BACKEND_URL from this template when the container
# starts. It terminates TLS before forwarding the request to this HTTP server.
# The SPA still calls /api on the SAME ORIGIN; Nginx proxies that path to the
# backend so the Secure, SameSite=Strict refresh cookie remains usable.
#
# BACKEND_URL must include the scheme and host, with no trailing slash, for
# example: https://accusharp-backend.onrender.com

map $http_x_forwarded_proto $original_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen ${PORT};
    server_name _;
    server_tokens off;

    # ---- Security headers for the SPA document ----------------------------
    include /etc/nginx/security-headers.conf;

    client_max_body_size 6m;   # slightly above the API's own 5 MB upload cap

    # ---- API -------------------------------------------------------------
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        # Use the upstream host for Render routing while preserving the public
        # frontend host separately for audit/debug information.
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;

        # Long enough for a whole-company payroll or attendance run, which are
        # synchronous today (see the async job item in the implementation plan).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- Static SPA -------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames, so these are safe to cache hard.
    location /static/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves clients on stale
    # bundles referencing files that no longer exist.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
